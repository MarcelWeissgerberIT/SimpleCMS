name: Coding worker and MCP bridge

# mcp/** — the coding worker and the local MCP bridge — on Linux, macOS and Windows: the whole mcp suite on Node 22 and
# 24 (26 joins when it turns LTS), and the smoke: a downloaded worker started with the card's own line, one task end to
# end (scripts/worker-smoke.mjs). mcp stands alone: `npm ci --prefix mcp`, never the root's install. Every push that
# touches these files runs it — the session branches' too — and it can be started by hand.
on:
  push:
    paths:
      - 'mcp/**'
      - 'src/shared/personalVault.ts'
      - 'src/shared/mcp/**'
      - 'src/app/features/coding/protocol.ts'
      - 'src/app/features/coding/relayBox.ts'
      - 'src/app/features/coding/startLines.ts'
      - 'src/app/features/mcp/contract.ts'
      - 'src/app/features/script/reference.ts'
      - 'tests/fixtures/mock-mcp.mjs'
      - 'scripts/worker-smoke.mjs'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'src/shared/personalVault.ts'
      - 'src/shared/mcp/**'
      - 'src/app/features/coding/protocol.ts'
      - 'src/app/features/coding/relayBox.ts'
      - 'src/app/features/coding/startLines.ts'
      - 'src/app/features/mcp/contract.ts'
      - 'src/app/features/script/reference.ts'
      - 'tests/fixtures/mock-mcp.mjs'
      - 'scripts/worker-smoke.mjs'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      # the files as committed (LF): the bundles, the fixtures and the shims the tests compare byte for byte
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      # v5: these actions themselves run on Node 24 (v4 targeted Node 20, which the runners force onto 24 with a warning)
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --prefix mcp
      - run: npm --prefix mcp run typecheck
      # a fixed test port inside a range Windows keeps (Hyper-V, WSL, Docker) fails at listen: named here first
      - name: Ports Windows keeps for itself
        if: runner.os == 'Windows'
        run: node mcp/test/ports.mjs
      - run: npm --prefix mcp test

  smoke:
    name: smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --prefix mcp
      - run: npm --prefix mcp run build
      - run: node scripts/worker-smoke.mjs
