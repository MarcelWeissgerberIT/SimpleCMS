<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>One — Workspace</title>
    <meta name="description" content="SimpleCMS One — a local-first workspace: block editor, databases, AI, automations." />
    <meta name="theme-color" content="#f2f0ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="SimpleCMS One" />
    <meta property="og:title" content="One — your local-first workspace" />
    <meta property="og:description" content="Pages, databases with 8 views and forms, Claude AI with your own key, webhook automations, import from Notion & co., publish as a website. Free. Local-first. No account." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://getonecms.com/app/" />
    <meta property="og:image" content="https://getonecms.com/assets/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="One — your local-first workspace" />
    <meta name="twitter:description" content="Pages, databases, Claude AI with your own key, webhooks, Notion import. Free. Local-first." />
    <meta name="twitter:image" content="https://getonecms.com/assets/og.png" />
    <meta name="apple-mobile-web-app-title" content="One" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/icons/app-icon-maskable.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html,body{margin:0;height:100%;background:#f2f0ea}
      @media (prefers-color-scheme: dark){html,body{background:#111110}}
      html[data-theme='dark'],html[data-theme='dark'] body{background:#111110}
      #boot{position:fixed;inset:0;display:grid;place-items:center;font:500 10.5px/1 ui-monospace,monospace;letter-spacing:.08em;color:#67635b;text-transform:uppercase}
      @media (prefers-color-scheme: dark){#boot{color:#8f8b83}}
      #boot i{display:block;width:6px;height:6px;margin:0 auto 10px;border-radius:9px;background:#ff4f00;animation:b 0.8s infinite alternate}
      @keyframes b{to{opacity:.2}}
    </style>
  </head>
  <body>
    <div id="boot"><div><i></i>Loading workspace</div></div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
